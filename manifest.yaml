# Skills, которые живут в kit и не перезаписываются из upstream
skillKitOwned:
  - 1c-bsl-review
  - git-publish-review
  - change-impact-review

# Rules, которые живут в kit (Clean-Kit / Sync их не затирают)
ruleKitOwned:
  - 1c-security-checklist
  - knowledge-feedback-loop
  - metadata-xml-workarounds
  - git-publish-hygiene
  - git-fix-last-commit
  - change-impact-analysis

skillExtras:
  caveman:
    source: comol
    path: content/skills/caveman
    category: workflow
  handoff:
    source: comol
    path: content/skills/handoff
    category: workflow
  1c-metadata-manage:
    source: comol
    path: content/skills/1c-metadata-manage
    category: workflow

install:
  globalRules: "%USERPROFILE%\\.cursor\\rules"
  globalSkills: "%USERPROFILE%\\.cursor\\skills"
  projectRules: ".cursor\\rules"
  # Проектные rules (alwaysApply) НЕ копируются глобально — только шаблон
