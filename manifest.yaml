# 1c-cursor-kit — реестр rules и skills
# Обновлять после Sync-Upstream.ps1

version: "1.3.2"
kitName: 1c-cursor-kit

upstream:
  desko77:
    repo: https://github.com/Desko77/cursor-1c-skills
    branch: master
    role: canonical  # skills + базовые rules (MIT)
  comol:
    repo: https://github.com/comol/ai_rules_1c
    branch: main
    role: workflow  # agents, commands, caveman/handoff
  fairballer:
    repo: https://github.com/fairballer-rgb/universal_1c_rules
    branch: master
    role: routing   # agent_routing, bsp_libraries

profiles:
  Minimal:
    description: "BSL-стандарты + маршрутизатор. Минимум контекста."
    rules: [1c-coding-standards, anti_patterns, form_module_rules]
    skills: [1c-config-router, 1c-bsl-review]
  Standard:
    description: "Полный platform/domain pack. Рекомендуется для УТ/CFE."
    rules: all_except_optional
    skills: [platform, domain]
  Full:
    description: "Standard + workflow (comol) + optional utilities."
    rules: all
    skills: [platform, domain, workflow, optional]

# Категории rules (файлы в rules/<category>/)
ruleCategories:
  bsl:
    - 1c-coding-standards
    - anti_patterns
    - form_module_rules
    - query-optimization-tips
    - async-methods-1c
    - refactoring
    - code-review-checklist
    - 1c-security-checklist
  forms-xml:
    - edt-form-xml-requirements
    - edt-zip-export-pitfalls
    - forms_events
    - forms_generation
    - 1c-form-reserved-names
  metadata:
    - 1c-extension-patterns
    - 1c-mdo-integrity
    - external-data-source-mdo
    - metadata-xml-workarounds
    - v8unpack-source-structure
    - 1c-role-rights
    - 1c-report-direct-query
    - bsp-profile-rights-api
    - routine_assignment_ext_processor
  workflow:
    - sdd-workflow
    - agent-verification-patterns
    - knowledge-feedback-loop
    - code-exploration-guide
    - model-selection
    - testing-patterns
    - git-publish-hygiene
    - git-fix-last-commit
    - change-impact-analysis
  core:
    - agent_routing
    - bsp_libraries
    - platform-solutions

# Источники rules вне Desko77 (merge при sync)
ruleExtras:
  agent_routing:
    source: fairballer
    path: .cursor/rules/agent_routing.mdc
    category: core
  bsp_libraries:
    source: fairballer
    path: .cursor/rules/bsp_libraries.mdc
    category: core
  platform-solutions:
    source: fairballer
    path: .cursor/rules/platform-solutions.mdc
    category: core

